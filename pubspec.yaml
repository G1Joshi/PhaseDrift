name: phasedrift
description: "Two realities. One momentum."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^2.0.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  material_ui: 1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/music/
    - assets/audio/sfx/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/logo/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#05060A"
  adaptive_icon_foreground: "assets/logo/icon.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/icon.png"
    background_color: "#05060A"
    theme_color: "#05060A"

flutter_native_splash:
  color: "#05060A"
  color_dark: "#05060A"
  image: "assets/logo/splash.png"
  fullscreen: true
  android_12:
    color: "#05060A"
    color_dark: "#05060A"
    image: "assets/logo/splash.png"
    icon_background_color: "#05060A"
